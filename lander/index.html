<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wikipedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <main>
    <header class="brand">
      <h1 class="wordmark"><span class="cap">W</span>ikipedi<span class="cap">a</span></h1>
      <p class="tagline">The Free Encyclopedia</p>
    </header>

    <div class="stage">
      <canvas id="globe" aria-label="Spinning puzzle globe. Hover to lift pieces, drag to turn it."></canvas>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="q">Ask Wikipedia</label>
      <textarea id="q" rows="2" placeholder="Ask anything about how Wikipedia changed…"></textarea>
      <div class="composer-row">
        <div class="lang-wrap">
          <button type="button" class="lang" id="lang" aria-haspopup="listbox" aria-expanded="false" aria-label="Language: English">en</button>
          <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
        </div>
        <button type="submit" class="send" id="send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>

    <div class="suggestions" id="suggestions">
      <button type="button">What did the Moon page look like in 2005?</button>
      <button type="button">How did Finland's article grow?</button>
      <button type="button">When was Climate change edited most?</button>
    </div>

    <section class="answer" id="answer" hidden aria-live="polite">
      <p class="answer-q" id="answer-q"></p>
      <p class="answer-text" id="answer-text"></p>
      <div class="answer-sources" id="answer-sources"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
