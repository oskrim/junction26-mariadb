<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wikipedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <main>
    <header class="brand">
      <h1 class="wordmark"><span class="cap">W</span>ikipedi<span class="cap">a</span></h1>
      <p class="tagline">The Free Encyclopedia</p>
    </header>

    <div class="stage">
      <canvas id="globe" aria-label="Spinning puzzle globe. Hover to lift pieces, drag to turn it."></canvas>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off" role="search">
        <label class="sr-only" for="q">Search Wikipedia</label>
        <textarea id="q" rows="1" placeholder="Search Wikipedia or ask a question" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"></textarea>
        <div class="controls">
          <div class="lang-wrap">
            <button type="button" class="lang" id="lang" aria-haspopup="listbox" aria-expanded="false" aria-label="Language: English"><span id="lang-code">EN</span>
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
          </div>
          <button type="submit" class="send" id="send" aria-label="Search" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </form>
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>

    <div class="examples" id="examples">
      <span>Try</span>
      <button type="button">Kalevala</button>
      <button type="button">Talvisota</button>
      <button type="button">Jean Sibelius</button>
      <button type="button">Helsinki</button>
      <button type="button">Kuka johti valkoisia sisällissodassa?</button>
    </div>

    <section class="results" id="results" hidden aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
