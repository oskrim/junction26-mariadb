<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikipedia as of</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 16px; }
  select, input[type=range] { width: 100%; }
  #date { font-size: 28px; font-weight: 600; margin: 12px 0 0; }
  #sql, #text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #sql { display: block; background: #f3f3f3; padding: 10px; border-radius: 6px; }
</style>

<select id="page"></select>
<p id="date"></p>
<input id="at" type="range" step="86400">
<p id="meta"></p>
<code id="sql"></code>
<pre id="text"></pre>

<script>
  const el = (id) => document.getElementById(id);
  let articles = [];

  async function show() {
    const at = Number(el("at").value);
    el("date").textContent = new Date(at * 1000).toISOString().slice(0, 10);
    const response = await fetch(`/api/article?id=${el("page").value}&at=${at}`);
    const { sql, version } = await response.json();
    if (at !== Number(el("at").value)) return; // the slider moved while this request was open
    el("sql").textContent = sql;
    el("meta").textContent = version
      ? `Version ${version.rev_id}, saved ${version.row_start} by ${version.user ?? "unknown"}` +
        (version.comment ? `: ${version.comment}` : "")
      : "The article did not exist at this moment.";
    el("text").textContent = version ? version.text : "";
  }

  function pick() {
    const article = articles.find((a) => String(a.page_id) === el("page").value);
    el("at").min = article.first;
    el("at").max = Math.floor(Date.now() / 1000);
    el("at").value = el("at").max;
    show();
  }

  async function start() {
    articles = await (await fetch("/api/articles")).json();
    for (const a of articles) el("page").add(new Option(`${a.title} (${a.versions} versions)`, a.page_id));
    el("page").onchange = pick;
    el("at").oninput = show;
    pick();
  }
  start();
</script>
