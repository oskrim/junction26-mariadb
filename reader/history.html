<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edit history · Wikipedia</title>
    <script>
      // History is now a view of the main page.
      const url = new URL("./", location.href);
      url.search = location.search;
      url.searchParams.set("view", "history");
      location.replace(url);
    </script>
  </head>
</html>
