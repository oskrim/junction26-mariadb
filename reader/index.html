<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wikipedia Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./cursor-menu.css" />
  </head>
  <body>
    <header class="bar">
      <a class="wordmark" href="./">Wikipedia</a>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
        <input type="search" placeholder="Search articles" />
      </label>
    </header>

    <div class="layout" id="top">
      <nav class="toc" aria-label="Contents"></nav>
      <main class="column">
        <header class="head"></header>
        <article class="body"></article>
      </main>
    </div>

    <div class="card card-preview" role="tooltip"></div>
    <div class="card card-ref" role="tooltip"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
