<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wikipedia Reader</title>
    <script>
      // The open view's modules, and the API answers its first paint needs, load alongside main.js instead of
      // after it. The URLs must match the ones api.js asks for, or the answers are fetched twice.
      {
        const params = new URLSearchParams(location.search);
        const view = params.get("view");
        const id = Number(params.get("id") ?? 1150);
        const at = Math.floor(Date.now() / 60000) * 60; // now() in api.js
        const modules = {
          explore: ["explore.js"],
          depth: ["concepts.js", "depth.js"],
          history: ["history.js", "article-panel.js", "diff.js", "history-cards.js", "history-model.js", "minimap.js", "timeline3d.js", "war-replay.js"],
        };
        const answers = [`/api/articles?id=${id}`, `/api/article?id=${id}&at=${at}`];
        if (view === "explore") answers.push(`/api/graph?at=${at}&id=${id}`);
        if (view === "history") answers.push(`/api/history?id=${id}`);
        const preload = (attrs) => document.head.append(Object.assign(document.createElement("link"), attrs));
        for (const file of modules[view] ?? []) preload({ rel: "modulepreload", href: `./${file}` });
        // Only when this server answers the API (BASE in api.js is "").
        if (location.origin === "https://65-109-75-60.sslip.io" || /^801\d$/.test(location.port)) {
          for (const href of answers) preload({ rel: "preload", as: "fetch", crossOrigin: "anonymous", href });
        }
      }
    </script>
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <link rel="modulepreload" href="./main.js" />
    <link rel="modulepreload" href="./api.js" />
    <link rel="modulepreload" href="./chat.js" />
    <link rel="modulepreload" href="./assistant.js" />
    <link rel="modulepreload" href="./fake/assistant.js" />
    <link rel="modulepreload" href="./learn.js" />
    <link rel="modulepreload" href="./learn-view.js" />
    <link rel="modulepreload" href="./learn-audio.js" />
    <link rel="modulepreload" href="./model3d.js" />
    <link rel="modulepreload" href="./cursor-menu.js" />
    <link rel="modulepreload" href="./hover-card.js" />
    <link rel="modulepreload" href="./search.js" />
    <link rel="modulepreload" href="./wikitext.js" />
    <link rel="modulepreload" href="./censor.js" />
    <link rel="modulepreload" href="./steps.js" />
    <link rel="modulepreload" href="./cite-tip.js" />
    <link rel="modulepreload" href="./math.js" />
    <link rel="modulepreload" href="./voice.js" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./explore.css" />
    <link rel="stylesheet" href="./depth.css" />
    <link rel="stylesheet" href="./cursor-menu.css" />
    <link rel="stylesheet" href="./learn-view.css" />
    <link rel="stylesheet" href="./history.css" />
    <link rel="stylesheet" href="./history-play.css" />
  </head>
  <body>
    <header class="bar">
      <a class="wordmark" href="/home/">Wikipedia</a>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
        <input type="search" placeholder="Search articles" />
        <kbd class="search-key" aria-hidden="true">/</kbd>
        <button type="button" class="search-go" aria-label="Search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8.5 4l4 4-4 4" /></svg>
        </button>
      </label>
      <nav class="views" aria-label="View">
        <button type="button" data-view="article" aria-pressed="true">Article</button>
        <button type="button" data-view="explore" aria-pressed="false">Explore</button>
        <button type="button" data-view="depth" aria-pressed="false">Concepts</button>
        <button type="button" data-view="history" aria-pressed="false">History</button>
      </nav>
    </header>

    <div class="layout" id="top">
      <nav class="toc" aria-label="Contents"></nav>
      <main class="column">
        <header class="head"></header>
        <article class="body"></article>
      </main>
    </div>

    <section class="explore" aria-label="Related articles" hidden></section>
    <section class="depth" aria-label="Concepts for seeing related articles" hidden></section>
    <section class="history-view" aria-label="Edit history" hidden></section>

    <div class="card card-preview" role="tooltip"></div>
    <div class="card card-ref" role="tooltip"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
